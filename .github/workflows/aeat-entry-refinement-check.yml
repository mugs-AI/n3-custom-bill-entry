name: AEAT entry refinement checks

on:
  push:
    branches:
      - verify/aeat-entry-refinement-check

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun x vitest run
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Production build
        run: bun run build
