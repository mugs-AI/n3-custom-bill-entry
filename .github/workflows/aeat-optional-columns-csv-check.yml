name: AEAT optional columns CSV checks

on:
  push:
    branches:
      - verify/aeat-optional-columns-csv-check

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun x vitest run
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
